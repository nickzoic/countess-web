<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CountESS Web</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="dag-editor.css">
<script src="dag-editor.js"> </script>

<link rel="stylesheet" href="schmeditor.css">
<script src="schmeditor.js"> </script>

<link rel="stylesheet" href="layout.css">
</head>
<body>
<header class="app-bar">
  <h1 class="app-name">CountESS</h1>
  <span class="file-name" id="file-name"></span>
  <!-- Only shown on narrow screens, where one pane is visible at a time. -->
  <nav class="tabs" role="tablist" aria-label="Panes">
    <button type="button" role="tab" id="tab-dag" aria-controls="pane-dag" aria-selected="true" data-pane="dag">Pipeline</button>
    <button type="button" role="tab" id="tab-config" aria-controls="pane-config" aria-selected="false" tabindex="-1" data-pane="config">Settings</button>
    <button type="button" role="tab" id="tab-view" aria-controls="pane-view" aria-selected="false" tabindex="-1" data-pane="view">Preview</button>
  </nav>
  <div class="toolbar" role="toolbar" aria-label="Pipeline">
    <button type="button" class="tool" id="layout-button" title="Arrange the graph (L)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="4" height="3" rx=".5"/><rect x="10.5" y="2.5" width="4" height="3" rx=".5"/><rect x="10.5" y="10.5" width="4" height="3" rx=".5"/><path d="M5.5 4h5M8 4v8h2.5"/></svg>
      Layout
    </button>
    <button type="button" class="tool" id="layout-pin" aria-pressed="false" title="Arrange the graph again whenever edges change (Shift+L)">
      Auto
    </button>
    <span class="toolbar-gap"></span>
    <button type="button" class="tool tool-save" id="save-button" title="Save the configuration file (Ctrl+S)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h9l2 2v9h-11z M5 2.5v3.5h5.5V2.5 M4.5 13.5V9.5h7v4"/></svg>
      <span id="save-label">Save</span>
    </button>
    <span class="save-status" id="save-status" role="status"></span>
  </div>
</header>

<main id="workspace" class="workspace">
  <section class="pane pane-dag is-active" id="pane-dag" data-pane="dag" aria-labelledby="title-dag">
    <header class="pane-head">
      <h2 class="pane-title" id="title-dag">Pipeline</h2>
      <button type="button" class="pane-max" aria-pressed="false" aria-label="Expand pipeline" title="Expand (Esc to restore)"></button>
    </header>
    <div id="dag-container" class="pane-body"></div>
  </section>

  <div class="splitter splitter-x" role="separator" tabindex="0" aria-orientation="vertical"
       aria-controls="pane-dag" aria-label="Resize pipeline and settings"
       aria-valuemin="0" aria-valuemax="100" data-axis="x"></div>

  <section class="pane pane-config" id="pane-config" data-pane="config" aria-labelledby="title-config">
    <header class="pane-head">
      <h2 class="pane-title" id="title-config">Settings</h2>
      <span class="pane-subject" id="config-subject"></span>
      <button type="button" class="pane-max" aria-pressed="false" aria-label="Expand settings" title="Expand (Esc to restore)"></button>
    </header>
    <div class="node-name" id="node-name-row" hidden>
      <label for="node-name">Name</label>
      <input type="text" id="node-name" autocomplete="off" spellcheck="false">
      <span class="node-name-error" id="node-name-error" role="alert"></span>
    </div>
    <div id="config-container" class="pane-body pane-scroll" data-empty="Select a node in the pipeline to edit its settings."></div>
  </section>

  <div class="splitter splitter-y" role="separator" tabindex="0" aria-orientation="horizontal"
       aria-controls="pane-dag pane-config" aria-label="Resize preview"
       aria-valuemin="0" aria-valuemax="100" data-axis="y"></div>

  <section class="pane pane-view" id="pane-view" data-pane="view" aria-labelledby="title-view">
    <header class="pane-head">
      <h2 class="pane-title" id="title-view">Preview</h2>
      <span class="pane-subject" id="view-status"></span>
      <span class="copy-status" id="copy-status" role="status"></span>
      <button type="button" class="pane-max" aria-pressed="false" aria-label="Expand preview" title="Expand (Esc to restore)"></button>
    </header>
    <div id="view-container" class="pane-body pane-scroll" tabindex="0"
         aria-label="Preview table. Click or drag to select cells, double-click to select the page; selections are copied as CSV."
         data-empty="Select a node to preview its output."></div>
    <footer class="pager" id="view-pager" hidden>
      <label class="pager-size">Rows per page
        <select id="page-size">
          <option>50</option>
          <option selected>100</option>
          <option>250</option>
          <option>500</option>
          <option>1000</option>
        </select>
      </label>
      <span class="pager-range" id="page-range" aria-live="polite"></span>
      <div class="pager-nav" role="group" aria-label="Pages">
        <button type="button" id="page-first" aria-label="First page" title="First page"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3v10M12 3 7 8l5 5"/></svg></button>
        <button type="button" id="page-prev" aria-label="Previous page" title="Previous page"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
        <label class="pager-page">Page
          <input type="number" id="page-number" min="1" value="1" inputmode="numeric">
          <span id="page-count"></span>
        </label>
        <button type="button" id="page-next" aria-label="Next page" title="Next page"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
        <button type="button" id="page-last" aria-label="Last page" title="Last page"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12 3v10M4 3l5 5-5 5"/></svg></button>
      </div>
    </footer>
  </section>
</main>

<script src="layout.js"> </script>
<script src="preview-select.js"> </script>
<script src="main.js"> </script>
</body>
</html>
